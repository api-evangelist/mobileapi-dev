components:
  schemas:
    Manufacturer:
      required:
      - name
      type: object
      properties:
        id:
          title: ID
          type: integer
          readOnly: true
        name:
          title: Name
          type: string
          maxLength: 255
          minLength: 1
        logo_b64:
          title: Logo b64
          type: string
          readOnly: true
        website_url:
          title: Website url
          description: Manufacturer official website URL
          type: string
          format: uri
          maxLength: 500
          nullable: true
    Network:
      type: object
      properties:
        id:
          title: ID
          type: integer
          readOnly: true
        technology:
          title: Technology
          description: Network technologies (e.g., GSM / CDMA / HSPA / LTE / 5G)
          type: string
        bands_2g:
          title: Bands 2g
          description: 2G bands
          type: string
        bands_3g:
          title: Bands 3g
          description: 3G bands
          type: string
        bands_4g:
          title: Bands 4g
          description: 4G/LTE bands
          type: string
        bands_5g:
          title: Bands 5g
          description: 5G bands
          type: string
        speed:
          title: Speed
          description: Network speed information
          type: string
    Comms:
      type: object
      properties:
        id:
          title: ID
          type: integer
          readOnly: true
        wlan:
          title: Wlan
          description: Wi-Fi specifications
          type: string
          maxLength: 255
        bluetooth:
          title: Bluetooth
          description: Bluetooth version and features
          type: string
          maxLength: 255
        positioning:
          title: Positioning
          description: GPS and positioning systems
          type: string
          maxLength: 255
        nfc:
          title: Nfc
          description: NFC availability
          type: string
          maxLength: 100
        radio:
          title: Radio
          description: FM radio availability
          type: string
          maxLength: 100
        usb:
          title: Usb
          description: USB specifications
          type: string
          maxLength: 255
    MainCamera:
      type: object
      properties:
        id:
          title: ID
          type: integer
          readOnly: true
        modules:
          title: Modules
          description: Camera modules/sensors (Single, Dual, Triple, Quad, etc.)
          type: string
        features:
          title: Features
          description: Camera features (LED flash, HDR, panorama, etc.)
          type: string
        video:
          title: Video
          description: Video recording capabilities
          type: string
    Image:
      type: object
      properties:
        id:
          title: ID
          type: integer
          readOnly: true
