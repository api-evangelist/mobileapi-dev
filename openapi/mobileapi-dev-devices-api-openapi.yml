  /devices/{id}/image/:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: devices_image_list
      summary: Serve Full-Resolution Device Main Image
      description: Returns the full-resolution main image of a device as binary data. Consumes 1 API credit per request. Requires authentication via API key (header recommended, query param for backwards compatibility).
      parameters:
      - name: Authorization
        in: header
        description: 'Recommended: ''Token YOUR_API_KEY'' or ''Bearer YOUR_API_KEY'''
        required: false
        schema:
          type: string
      - name: key
        in: query
        description: 'Fallback: API key as query parameter (less secure, visible in logs)'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Binary image data
          content:
            application/json:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized - API key required
        '404':
          description: Device or image not found
        '429':
          description: Rate limit exceeded - monthly credits exhausted
      tags:
      - devices
  /devices/{id}/images/:
    parameters:
    - name: id
      in: path
      description: A unique integer value identifying this device.
      required: true
      schema:
        type: integer
    get:
      operationId: devices_images
      summary: Get Device Images
      description: Get all images for a specific device. Returns image URLs for full-resolution access (accessing image URLs consumes 1 credit per request). Main device image is included as the first entry with URL /devices/{id}/image/.
      parameters:
      - name: limit
        in: query
        description: 'Maximum number of images to return (default: 10, max: 30).'
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Device images with URLs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Image'
        '400':
          description: Bad request, invalid limit parameter
        '404':
          description: Device not found
      tags:
      - devices
