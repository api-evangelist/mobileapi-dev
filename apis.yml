apis:
  - aid: mobileapi-dev:mobileapi
    name: MobileAPI
    description: REST API providing device specifications, base64-encoded product images, and pricing metadata for 31,500+ smartphones,
      tablets, smartwatches, and laptops across 200+ manufacturers. Endpoints support paginated device listing, fuzzy search
      by name or model number, autocomplete, browsing by manufacturer/year/type, per-category specification retrieval (battery,
      display, platform, memory, cameras, network, sound, comms, features, body, misc), high-resolution images, manufacturer
      directory, account introspection (/me/), and an AI natural-language query endpoint that translates plain-English questions
      into structured device results.
