aid: mobileapi-dev
name: MobileAPI.dev
description: MobileAPI.dev is a commercial REST API that provides structured device specifications, product images, and metadata
  for over 31,500 smartphones, tablets, smartwatches, and laptops from more than 200 brands. The API exposes 12 normalized
  spec categories per device (Network, Body, Display, Platform, Memory, Main Camera, Selfie Camera, Sound, Comms, Features,
  Battery, Misc), fuzzy search, autocomplete, manufacturer indices, and a natural-language AI query endpoint, replacing in-house
  scraping of GSMArena-style sources for device-catalog, comparison, e-commerce, trade-in, repair, and insurance applications.
