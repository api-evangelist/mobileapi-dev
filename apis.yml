  - type: Features
    data:
    - name: Comprehensive Device Database
      description: 31,500+ smartphones, tablets, smartwatches, and laptops across 200+ brands including Apple, Samsung, Google,
        OnePlus, Xiaomi, Huawei, Realme, and Infinix.
    - name: Twelve Normalized Spec Categories
      description: Each device returns structured data across Network, Body, Display, Platform, Memory, Main Camera, Selfie
        Camera, Sound, Comms, Features, Battery, and Misc with dedicated per-category endpoints.
    - name: Embedded Product Images
      description: Multiple official product images per device, returned as base64-encoded payloads plus 100x100 thumbnails,
        eliminating the need to host an image CDN.
    - name: Fuzzy Search and Autocomplete
      description: Manufacturer-aware search tolerates typos, partial names, and model number variations; a separate autocomplete
        endpoint powers search-as-you-type UIs.
    - name: AI Natural-Language Query
      description: A /devices/ai-query/ endpoint translates plain-English questions like 'phones with 8GB+ RAM under 200g' or
        'best camera phones from 2024' into structured device results (paid plans only).
    - name: Browse-By Indices
      description: Dedicated endpoints to list devices by manufacturer, launch year, or device type for building brand pages,
        new releases feeds, or category navigation.
    - name: Token or Bearer Authentication
      description: API keys can be supplied via Authorization Token, Authorization Bearer, or a key= query parameter fallback;
        both header formats are equivalent.
    - name: Rate-Limit Headers
      description: Every response includes X-RateLimit-Limit, X-RateLimit-Remaining, and X-RateLimit-Reset so clients can self-throttle;
        quota exceedance returns HTTP 429.
    - name: Demo Endpoints (No Key Required)
      description: A /demo-x7k9m2p4/devices/ mirror of the authenticated tree allows zero-key evaluation of every endpoint shape
        before signing up.
    - name: Account Introspection
      description: GET /me/ returns plan, quota, and usage metadata for the authenticated key.
    - name: Status Page and Uptime
      description: Real-time Cronitor-hosted status page with 99.9% uptime guarantee on Business and Enterprise tiers.
    sources:
    - https://mobileapi.dev/
    - https://mobileapi.dev/docs/
    updated: '2026-05-06'
  - type: UseCases
    data:
    - name: Device Catalog and Comparison Sites
      description: Power product catalog and side-by-side spec comparison pages with up-to-date specs and images for current
        and historical devices.
    - name: Trade-In and Buyback Platforms
      description: Identify a device by name, model number, or autocomplete suggestion and pull structured specs for valuation
        and resale workflows.
    - name: Repair and Service Workflows
      description: Look up displays, batteries, cameras, and connectivity details to drive parts selection and pricing in repair-shop
        applications.
    - name: Insurance and Warranty Quoting
      description: Resolve user-supplied device names to canonical models and risk-tier specs for handset insurance and warranty
        premium calculations.
    - name: E-commerce Product Pages
      description: Auto-fill product detail pages with normalized specs and base64 images for marketplace listings, retail sites,
        and affiliate stores.
    - name: AI Assistants and Recommender Bots
      description: Use the AI natural-language query endpoint to power conversational device recommendations grounded in real
        specifications.
    - name: Carrier and MVNO Compatibility Tools
      description: Match the network bands (2G/3G/4G/5G) of a customer's device against carrier coverage to drive bring-your-own-device
        flows.
    - name: Reviews and Tech Editorial Sites
      description: Embed structured spec sheets in reviews and news posts without scraping or maintaining an in-house spec database.
    sources:
    - https://mobileapi.dev/
    updated: '2026-05-06'
  - type: Integrations
    data:
    - name: cURL
      description: Documented cURL recipes for /devices/search/ and other endpoints with Content-Type application/json and query-parameter
        API keys.
    - name: JavaScript / Fetch
      description: Documented fetch-based examples for browser and Node.js integrations.
    - name: Python / Requests
      description: Documented Python requests snippets for device search and retrieval.
    - name: PHP
      description: Documented PHP file_get_contents plus http_build_query examples.
    - name: Stripe
      description: Stripe-hosted checkout flow handles plan upgrades and recurring billing (referenced in CSP allowlist and
        /payment_successful callback).
    - name: Help Scout Beacon
      description: In-app support widget powered by Help Scout for paid-plan ticketing.
    - name: Cronitor Status Page
      description: Public uptime and incident history hosted on Cronitor at mobileapi.cronitorstatus.com.
    - name: GetTerms.io
      description: Terms of Service and Privacy Policy hosted on GetTerms.io.
    sources:
    - https://mobileapi.dev/docs/
    - https://mobileapi.dev/
    updated: '2026-05-06'
  - type: Plans
    data:
    - name: Free
      description: $0/mo. 200 requests/month, 5 requests/minute, full database access, monthly data updates, community support.
    - name: Pro
      description: $15/mo (15% annual discount). 10,000 requests/month (~333/day), 10 requests/second, weekly data updates,
        priority email support, advanced analytics, commercial usage rights.
    - name: Enterprise
      description: Custom pricing. Unlimited requests, custom rate limits up to 100 req/sec, daily data updates, dedicated support,
        99.9% SLA, account manager, custom integrations.
    sources:
    - https://mobileapi.dev/#pricing
    - https://mobileapi.dev/docs/
    updated: '2026-05-06'
  - type: RateLimits
    data:
    - name: Free Tier Rate Limit
      description: 5 requests/minute, 200 requests/month quota.
    - name: Pro Tier Rate Limit
      description: 10 requests/second, 10,000 requests/month quota.
    - name: Enterprise Tier Rate Limit
      description: Custom, up to 100 requests/second, unlimited monthly requests.
    - name: Rate-Limit Headers
      description: All responses include X-RateLimit-Limit, X-RateLimit-Remaining, and X-RateLimit-Reset; quota exceedance returns
        HTTP 429.
    sources:
    - https://mobileapi.dev/docs/
    updated: '2026-05-06'
