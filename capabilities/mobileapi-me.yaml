naftiko: 1.0.0-alpha2
info:
  label: MobileAPI — me
  description: 'MobileAPI — me. 1 operations. Lead operation: me. Self-contained Naftiko capability covering one Mobileapi
    Dev business surface.'
  tags:
  - Mobileapi Dev
  - me
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MOBILEAPI_DEV_API_KEY: MOBILEAPI_DEV_API_KEY
capability:
  consumes:
  - type: http
    namespace: mobileapi-me
    baseUri: https://api.mobileapi.dev
    description: MobileAPI — me business capability. Self-contained, no shared references.
    resources:
    - name: me
      path: /me/
      operations:
      - name: melist
        method: GET
        description: ''
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.MOBILEAPI_DEV_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: mobileapi-me-rest
    port: 8080
    description: REST adapter for MobileAPI — me. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/me
      name: me
      description: REST surface for me.
      operations:
      - method: GET
        name: melist
        description: melist
        call: mobileapi-me.melist
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: mobileapi-me-mcp
    port: 9090
    transport: http
    description: MCP adapter for MobileAPI — me. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: melist
      description: melist
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: mobileapi-me.melist
      outputParameters:
      - type: object
        mapping: $.
