        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Authorization
          in: header
          type: string
          description: 'Recommended: ''Token YOUR_API_KEY'' or ''Bearer YOUR_API_KEY'''
        - name: key
          in: query
          type: string
          description: 'Fallback: API key as query parameter (less secure, visible in logs)'
    - name: devices-id-images
      path: /devices/{id}/images/
