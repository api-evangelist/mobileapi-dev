naftiko: 1.0.0-alpha2
info:
  label: MobileAPI — devices
  description: 'MobileAPI — devices. 24 operations. Lead operation: List All Devices. Self-contained Naftiko capability covering
    one Mobileapi Dev business surface.'
  tags:
  - Mobileapi Dev
  - devices
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MOBILEAPI_DEV_API_KEY: MOBILEAPI_DEV_API_KEY
capability:
  consumes:
  - type: http
    namespace: mobileapi-devices
    baseUri: https://api.mobileapi.dev
    description: MobileAPI — devices business capability. Self-contained, no shared references.
    resources:
    - name: devices
      path: /devices/
      operations:
      - name: deviceslist
        method: GET
        description: List All Devices
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Authorization
          in: header
          type: string
          description: 'Recommended: ''Token YOUR_API_KEY'' or ''Bearer YOUR_API_KEY'''
        - name: key
          in: query
          type: string
          description: 'Fallback: API key as query parameter (optional for demo)'
        - name: page
          in: query
          type: integer
          description: 'Page number (default: 1). Each page contains 50 devices.'
    - name: devices-ai-query
      path: /devices/ai-query/
      operations:
      - name: devicesaiquery
        method: GET
        description: Natural Language Device Query (AI-Powered) - Paid Users Only
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: query
          in: query
          type: string
          description: Natural language query (e.g., 'top 5 devices with most RAM', 'phones with best battery')
          required: true
        - name: Authorization
          in: header
          type: string
          description: 'Recommended: ''Token YOUR_API_KEY'' or ''Bearer YOUR_API_KEY'' (requires paid plan)'
        - name: key
          in: query
          type: string
          description: 'Fallback: API key as query parameter (requires paid plan)'
    - name: devices-autocomplete
      path: /devices/autocomplete/
      operations:
      - name: devicesautocomplete
        method: GET
        description: Autocomplete Device Names
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Authorization
          in: header
          type: string
          description: 'Recommended: ''Token YOUR_API_KEY'' or ''Bearer YOUR_API_KEY'''
        - name: key
          in: query
          type: string
          description: 'Fallback: API key as query parameter (optional for demo)'
        - name: q
          in: query
          type: string
          description: Query string (minimum 5 characters)
          required: true
        - name: limit
          in: query
          type: integer
          description: 'Maximum number of suggestions to return (default: 10, max: 30).'
    - name: devices-by-brand
      path: /devices/by-brand/
      operations:
      - name: devicesbybrand
        method: GET
        description: '[Deprecated] List Devices by Brand - Use /by-Manufacturer/ Instead'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: brand
          in: query
          type: string
          description: 'Brand/Manufacturer name to filter devices (e.g., ''Apple'', ''Samsung''). DEPRECATED: Use ''manufacturer''
            parameter with /by-manufacturer/ endpoint instead.'
          required: true
        - name: limit
          in: query
          type: integer
          description: 'Maximum number of results to return (default: 10, max: 30).'
        - name: Authorization
          in: header
          type: string
          description: 'Recommended: ''Token YOUR_API_KEY'' or ''Bearer YOUR_API_KEY'''
        - name: key
          in: query
          type: string
          description: 'Fallback: API key as query parameter (less secure)'
    - name: devices-by-manufacturer
      path: /devices/by-manufacturer/
      operations:
      - name: devicesbymanufacturer
        method: GET
        description: List Devices by Manufacturer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: manufacturer
          in: query
          type: string
          description: Manufacturer name to filter devices (e.g., 'Apple', 'Samsung').
          required: true
        - name: page
          in: query
          type: integer
          description: 'Page number (default: 1). Each page contains 50 devices.'
        - name: Authorization
          in: header
          type: string
          description: 'Recommended: ''Token YOUR_API_KEY'' or ''Bearer YOUR_API_KEY'''
        - name: key
          in: query
          type: string
          description: 'Fallback: API key as query parameter (less secure)'
    - name: devices-by-type
      path: /devices/by-type/
      operations:
      - name: devicesbytype
        method: GET
        description: List Devices by Type
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: type
          in: query
          type: string
          description: 'Device type: phone, tablet, laptop, wearable, or other'
          required: true
        - name: page
          in: query
          type: integer
          description: 'Page number (default: 1). Each page contains 50 devices.'
        - name: Authorization
          in: header
          type: string
          description: 'Recommended: ''Token YOUR_API_KEY'' or ''Bearer YOUR_API_KEY'''
        - name: key
          in: query
          type: string
          description: 'Fallback: API key as query parameter (less secure)'
    - name: devices-by-year
      path: /devices/by-year/
      operations:
      - name: devicesbyyear
        method: GET
        description: List Devices by Launch Year
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: year
          in: query
          type: integer
          description: Launch year (4-digit format, e.g., 2023)
          required: true
        - name: page
          in: query
          type: integer
          description: 'Page number (default: 1). Each page contains 50 items.'
        - name: Authorization
          in: header
          type: string
          description: 'Recommended: ''Token YOUR_API_KEY'' or ''Bearer YOUR_API_KEY'''
        - name: key
          in: query
          type: string
          description: 'Fallback: API key as query parameter (less secure)'
    - name: devices-search
      path: /devices/search/
      operations:
      - name: devicessearch
        method: GET
        description: Search Device by Name or Model Number
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Authorization
          in: header
          type: string
          description: 'Recommended: ''Token YOUR_API_KEY'' or ''Bearer YOUR_API_KEY'''
        - name: key
          in: query
          type: string
          description: 'Fallback: API key as query parameter (optional for demo)'
        - name: name
          in: query
          type: string
          description: Name of the device to search for (e.g., 'iPhone 15 Pro'). Mutually exclusive with 'model_number'.
        - name: model_number
          in: query
          type: string
          description: Model number of the device to search for (e.g., 'A3520'). Mutually exclusive with 'name'.
        - name: manufacturer
          in: query
          type: string
          description: Optional. Filter search results to devices from this manufacturer only. If no devices match the manufacturer,
            returns empty results.
        - name: limit
          in: query
          type: integer
          description: 'Optional. Number of results to return per page (default: 10, max: 30). Use this to control how many
            devices are returned in the response. For example, limit=1 r'
        - name: page
          in: query
          type: integer
          description: 'Page number (default: 1). Each page contains 50 devices.'
        - name: exact
          in: query
          type: boolean
          description: 'Set to true for exact matching (default: false). When true, only returns devices with 100% match certainty
            (exact name or exact model number match).'
    - name: devices-id
