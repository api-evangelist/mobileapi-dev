naftiko: 1.0.0-alpha2
info:
  label: MobileAPI — images
  description: 'MobileAPI — images. 1 operations. Lead operation: Serve Full-Resolution Gallery Image. Self-contained Naftiko
    capability covering one Mobileapi Dev business surface.'
  tags:
  - Mobileapi Dev
  - images
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MOBILEAPI_DEV_API_KEY: MOBILEAPI_DEV_API_KEY
capability:
  consumes:
  - type: http
    namespace: mobileapi-images
    baseUri: https://api.mobileapi.dev
    description: MobileAPI — images business capability. Self-contained, no shared references.
    resources:
    - name: images-id
      path: /images/{id}/
      operations:
      - name: imagesread
        method: GET
        description: Serve Full-Resolution Gallery Image
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Authorization
          in: header
          type: string
          description: 'Recommended: ''Token YOUR_API_KEY'' or ''Bearer YOUR_API_KEY'''
        - name: key
          in: query
          type: string
          description: 'Fallback: API key as query parameter (less secure, visible in logs)'
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.MOBILEAPI_DEV_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: mobileapi-images-rest
    port: 8080
    description: REST adapter for MobileAPI — images. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/images/{id}
      name: images-id
      description: REST surface for images-id.
      operations:
      - method: GET
        name: imagesread
        description: Serve Full-Resolution Gallery Image
        call: mobileapi-images.imagesread
        with:
          Authorization: rest.Authorization
          key: rest.key
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: mobileapi-images-mcp
    port: 9090
    transport: http
    description: MCP adapter for MobileAPI — images. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: serve-full-resolution-gallery-image
      description: Serve Full-Resolution Gallery Image
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: mobileapi-images.imagesread
      with:
        Authorization: tools.Authorization
        key: tools.key
      outputParameters:
      - type: object
        mapping: $.
