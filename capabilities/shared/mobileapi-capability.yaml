naftiko: 1.0.0-alpha2
info:
  label: MobileAPI
  description: MobileAPI.dev device specifications API capability.
  tags:
  - MobileAPI
  - Device Specifications
  - Mobile Devices
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: mobileapi
    baseUri: https://api.mobileapi.dev
    description: MobileAPI.dev REST API for device specifications, images, and pricing.
    authentication:
      type: bearer
      token: '{{MOBILEAPI_TOKEN}}'
    resources:
    - name: resource-devices
      path: /devices/
      operations:
      - name: devices-list
        method: GET
        description: List All Devices
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page
          in: query
          type: integer
          description: 'Page number (default: 1). Each page contains 50 devices.'
    - name: resource-devices-ai-query
      path: /devices/ai-query/
      operations:
      - name: devices-ai-query
        method: GET
        description: Natural Language Device Query (AI-Powered) - Paid Users Only
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: query
          in: query
          type: string
          description: Natural language query (e.g., 'top 5 devices with most RAM', 'phones with best battery')
    - name: resource-devices-autocomplete
      path: /devices/autocomplete/
      operations:
      - name: devices-autocomplete
        method: GET
        description: Autocomplete Device Names
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: q
          in: query
          type: string
          description: Query string (minimum 5 characters)
        - name: limit
          in: query
          type: integer
          description: 'Maximum number of suggestions to return (default: 10, max: 30).'
    - name: resource-devices-by-brand
      path: /devices/by-brand/
      operations:
      - name: devices-by-brand
        method: GET
        description: '[Deprecated] List Devices by Brand - Use /by-Manufacturer/ Instead'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: brand
          in: query
          type: string
          description: 'Brand/Manufacturer name to filter devices (e.g., ''Apple'', ''Samsung''). DEPRECATED: Use ''manufacturer''
            parameter with /by-manufacturer/ endpoint instead.'
        - name: limit
          in: query
          type: integer
          description: 'Maximum number of results to return (default: 10, max: 30).'
    - name: resource-devices-by-manufacturer
      path: /devices/by-manufacturer/
      operations:
      - name: devices-by-manufacturer
        method: GET
        description: List Devices by Manufacturer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: manufacturer
          in: query
          type: string
          description: Manufacturer name to filter devices (e.g., 'Apple', 'Samsung').
        - name: page
          in: query
          type: integer
          description: 'Page number (default: 1). Each page contains 50 devices.'
    - name: resource-devices-by-type
      path: /devices/by-type/
      operations:
      - name: devices-by-type
        method: GET
        description: List Devices by Type
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: type
          in: query
          type: string
          description: 'Device type: phone, tablet, laptop, wearable, or other'
        - name: page
          in: query
          type: integer
          description: 'Page number (default: 1). Each page contains 50 devices.'
    - name: resource-devices-by-year
      path: /devices/by-year/
      operations:
      - name: devices-by-year
        method: GET
        description: List Devices by Launch Year
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: year
          in: query
          type: integer
          description: Launch year (4-digit format, e.g., 2023)
        - name: page
          in: query
          type: integer
          description: 'Page number (default: 1). Each page contains 50 items.'
    - name: resource-devices-search
      path: /devices/search/
      operations:
      - name: devices-search
        method: GET
        description: Search Device by Name or Model Number
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: query
          type: string
          description: Name of the device to search for (e.g., 'iPhone 15 Pro'). Mutually exclusive with 'model_number'.
        - name: model_number
          in: query
          type: string
          description: Model number of the device to search for (e.g., 'A3520'). Mutually exclusive with 'name'.
        - name: manufacturer
          in: query
          type: string
          description: Optional. Filter search results to devices from this manufacturer only. If no devices match the manufacturer,
            returns empty results.
        - name: limit
          in: query
          type: integer
          description: 'Optional. Number of results to return per page (default: 10, max: 30). Use this to control how many
            devices are returned in the response. For example, limit=1 returns only the best match.'
        - name: page
          in: query
          type: integer
          description: 'Page number (default: 1). Each page contains 50 devices.'
        - name: exact
          in: query
          type: boolean
          description: 'Set to true for exact matching (default: false). When true, only returns devices with 100% match certainty
            (exact name or exact model number match).'
    - name: resource-devices-id
      path: /devices/{id}/
      operations:
      - name: devices-read
        method: GET
        description: Get Device by ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: integer
          description: A unique integer value identifying this device.
    - name: resource-devices-id-battery
      path: /devices/{id}/battery/
      operations:
      - name: devices-battery
        method: GET
        description: Get Device Battery Specifications
